# ==============================================================================
# NGINX Configuration - Simulates ALB Path-Based Routing
#
# This configuration mimics the ALB listener rules:
# /account-svc/*  → Account Service
# /transfer-svc/* → Transfer Service
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    # Logging format similar to ALB access logs
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'upstream: $upstream_addr path: $uri';

    access_log /dev/stdout main;
    error_log /dev/stderr;

    # Upstream definitions
    upstream account-service {
        server account-service:8080;
    }

    upstream transfer-service {
        server transfer-service:8080;
    }

    server {
        listen 80;
        server_name localhost;

        # ==================================================================
        # Account Service Routes
        # Simulates ALB rule: path-pattern /account-svc/*
        # ==================================================================
        location /account-svc/ {
            proxy_pass http://account-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Debug header to show path transformation
            add_header X-Route-Debug "account-service" always;
        }

        # ==================================================================
        # Transfer Service Routes
        # Simulates ALB rule: path-pattern /transfer-svc/*
        # ==================================================================
        location /transfer-svc/ {
            proxy_pass http://transfer-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Debug header to show path transformation
            add_header X-Route-Debug "transfer-service" always;
        }

        # ==================================================================
        # Default: Return 404 for unmatched paths
        # Simulates ALB default action
        # ==================================================================
        location / {
            return 404 '{"error": "Not Found", "message": "No route configured for this path"}';
            add_header Content-Type application/json;
        }

        # Health check endpoint
        location /health {
            return 200 '{"status": "healthy"}';
            add_header Content-Type application/json;
        }
    }
}
